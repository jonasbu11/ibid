name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - run: node deploy/build.mjs && node deploy/build.mjs supabase
  live:
    # Builds the deploy script as a non-superuser against real Postgres, the
    # way a managed database would run it. PGlite's superuser hides ownership
    # and privilege bugs that bite live.
    runs-on: ubuntu-latest
    needs: test
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ibid
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node deploy/build.mjs
      - name: apply as a non-superuser
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ibid -v ON_ERROR_STOP=1 -c "create role deployer login password 'deployer' createrole; grant all on database ibid to deployer; grant all on schema public to deployer;"
          PGPASSWORD=deployer psql -h localhost -U deployer -d ibid -v ON_ERROR_STOP=1 -f deploy/ibid.sql
          for f in test/live/*.sql; do [ -e "$f" ] || continue; PGPASSWORD=deployer psql -h localhost -U deployer -d ibid -v ON_ERROR_STOP=1 -f "$f"; done
