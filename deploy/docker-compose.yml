# Local Postgres for Ibid. pg_trgm ships with Postgres; pgvector is optional
# and only needed if you switch the resolver to the embedding provider.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   psql postgres://ibid:ibid@localhost:5433/ibid -f deploy/ibid.sql
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ibid
      POSTGRES_PASSWORD: ibid
      POSTGRES_DB: ibid
    ports:
      - "5433:5432"
    volumes:
      - ibid-data:/var/lib/postgresql/data
volumes:
  ibid-data:
